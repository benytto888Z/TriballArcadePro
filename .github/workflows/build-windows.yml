name: Build Windows — Game Area (exportable)

# Produit le .zip portable à copier sur le PC de la TV arcade, sans avoir à
# installer Flutter localement :
#   • onglet Actions -> "Build Windows — Game Area (exportable)" -> Run workflow
#     => artifact "TriballGameArea-windows-..." à télécharger
#   • ou créer un tag v1.0.0-beta1 => GitHub Release avec le .zip + .sha256 en pièce jointe

on:
  workflow_dispatch:
    inputs:
      label:
        description: 'Suffixe du build (beta1, rc2, test-site…)'
        required: false
        default: 'beta1'
        type: string
      run_tests:
        description: 'Exécuter flutter test avant le build'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 (release)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Read version from pubspec
        id: ver
        run: |
          $raw = Get-Content triball_game_area/pubspec.yaml -Raw
          $v = '0.0.0'
          if ($raw -match '(?m)^version:\s*([0-9][^\s+]*)') { $v = $Matches[1] }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "version = $v"

      - name: flutter pub get
        working-directory: triball_game_area
        run: flutter pub get

      - name: Static analysis (informatif — ne bloque pas le beta)
        working-directory: triball_game_area
        continue-on-error: true
        run: flutter analyze

      - name: Tests (informatifs — un beta doit rester producible)
        if: ${{ inputs.run_tests != false }}
        working-directory: triball_game_area
        continue-on-error: true
        run: flutter test

      - name: flutter build windows --release
        working-directory: triball_game_area
        run: flutter build windows --release --no-pub

      - name: Assemble the portable package
        run: ./tools/package-windows.ps1 -SkipBuild -Offline -SkipTests -Label "${{ github.event.inputs.label || 'beta1' }}"

      - name: Show package contents
        run: Get-ChildItem dist -Recurse -File | Select-Object -First 40 | ForEach-Object { "{0,10}  {1}" -f $_.Length, $_.FullName.Replace((Get-Location).Path, '') }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TriballGameArea-windows-v${{ steps.ver.outputs.version }}-run${{ github.run_number }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = Get-ChildItem dist -Filter '*.zip' | Select-Object -First 1
          if (-not $zip) { throw "aucun .zip produit" }
          $tag = "${{ github.ref_name }}"
          $notes = @(
            "Build Windows x64 du Game Area TRIBALL (paquet portable).",
            "",
            "- dezipper puis lancer install-on-target.ps1 dans le dossier extrait",
            "- ou copier le dossier et lancer triball_game_area.exe",
            "",
            "Details, prerequisites et pannes frequentes : docs/INSTALL-WINDOWS-BETA.md (inclus dans le zip)."
          ) -join "`n"
          gh release create $tag --title "TRIBALL Game Area $tag" --notes $notes --latest $zip.FullName "$($zip.FullName).sha256"
